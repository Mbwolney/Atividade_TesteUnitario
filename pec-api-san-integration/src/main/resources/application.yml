server:
  port: 8081

spring:
  application:
    name: pec-api-san-integration
  datasource:
    url: jdbc:h2:mem:pec;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    producer:
      bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
      acks: all
      retries: ${PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: ${PRODUCER_IDEMPOTENT:true}
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
        sasl.jaas.config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
        ssl.protocol: TLSv1.2
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
      group-id: pec-api-san-grp
      auto-offset-reset: earliest
      properties:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
        sasl.jaas.config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
        ssl.protocol: TLSv1.2
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: "*"

pec:
  kafka:
    topics:
      san-processo-simples: TP_SAN_PROCESSO_SIMPLES
      san-envio-anuencia-mcr: TP_SAN_ENVIO_ANUENCIA_MCR
  anuencia:
    validade-default-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
